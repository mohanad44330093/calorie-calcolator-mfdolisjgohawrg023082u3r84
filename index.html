* { box-sizing: border-box; }

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nd = s => String(s).replace(/[٠-٩]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x660 + 48)).replace(/[۰-۹]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x6F0 + 48)).replace(/٫/g, '.').replace(/،/g, ',');
const num = v => { const x = parseFloat(nd(v).replace(',', '.')); return isFinite(x) && x >= 0 ? x : NaN; };
const norm = s => nd(String(s).toLowerCase()).replace(/[ً-ْـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/[^\p{L}\p{N}\s.%]/gu, ' ').replace(/\s+/g, ' ').trim();
const stripAl = w => (w.length > 3 && w.startsWith('ال')) ? w.slice(2) : w;
const f1 = n => (Math.round(n * 10) / 10).toFixed(1);
const f0 = n => String(Math.round(n));

const svg = {

};

/* ---------- food index ---------- */
const BASE = FOODS.map(f => Object.assign({ kind: f.id[0] === 'u' ? 'usda' : 'recipe' }, f));
function withIdx(f) { f._n = norm(f.n); f._w = f._n.split(' ').map(stripAl); f._a = norm(f.al || '').split(' ').map(stripAl).join(' '); return f; }
BASE.forEach(withIdx);

/* ---------- state ---------- */
const KEY = 'diet-calc-v1';
const mk = (fid, q, u) => ({ id: uid(), fid, q, u });

  return {
    sample: true, plan: '', client: '', active: 0, targets: { k: '', p: '', c: '', f: '' }, custom: [],
    days: [d('اليوم 1', [
      m('الفطار', [mk(byName('بيض مسلوق'), 3, 0), mk(byName('عيش بلدي'), 1, 0), mk(byName('جبنة قريش'), 100, -1), mk(byName('طماطم'), 1, 0)]),
      m('الغداء', [mk(byName('صدر فراخ مطبوخ'), 200, -1), mk(byName('رز أبيض مطبوخ'), 200, -1), mk(byName('سلطة خضراء'), 150, -1), mk(byName('زيت زيتون'), 1, 0)]),
      m('سناك', [mk(byName('زبادي يوناني'), 1, 0), mk(byName('موز'), 1, 0), mk(byName('لوز'), 20, -1)]),

  };
}
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && Array.isArray(s.days) && s.days.length) return s; } catch (e) {} return null; }
let S = load() || sampleState();
S.custom = (S.custom || []); S.targets = S.targets || { k: '', p: '', c: '', f: '' }; S.active = Math.min(S.active || 0, S.days.length - 1);
S.custom.forEach(withIdx);
let saveT = 0; const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S, (k, v) => k[0] === '_' ? undefined : v)); } catch (e) {} }, 400); };
const allFoods = () => BASE.concat(S.custom);

/* ---------- math ---------- */
function unitOf(food, it) { return it.u >= 0 && food && food.u && food.u[it.u] ? food.u[it.u] : null; }
function gramsOf(food, it) { const q = num(it.q); if (!food || !isFinite(q)) return 0; const u = unitOf(food, it); return q * (u ? u[1] : 1); }
function macrosOf(food, it) { const g = gramsOf(food, it), r = g / 100; return food ? { g, k: food.k * r, p: food.p * r, c: food.c * r, f: food.f * r, fi: (food.fi || 0) * r } : { g: 0, k: 0, p: 0, c: 0, f: 0, fi: 0 }; }
const zero = () => ({ g: 0, k: 0, p: 0, c: 0, f: 0, fi: 0 });
const add = (a, b) => { for (const k in a) a[k] += b[k]; return a; };
function mealTotal(m) { const t = zero(); m.items.forEach(it => add(t, macrosOf(foodById(it.fid), it))); return t; }
function dayTotal(d) { const t = zero(); d.meals.forEach(m => add(t, mealTotal(m))); return t; }
const day = () => S.days[S.active];

/* ---------- search ---------- */
function search(q) {
  const parsed = parseQuery(q); const toks = norm(parsed.text).split(' ').filter(Boolean).map(stripAl);
  if (!toks.length) return [];
  const out = [];
  for (const f of allFoods()) {
    let score = 0, ok = true;
    for (const t of toks) {
      if (f._w.some(w => w === t)) score += 60;
      else if (f._w.some(w => w.startsWith(t))) score += 45;
      else if (f._n.includes(t)) score += 25;
      else if (f._a.includes(t)) score += 10;
      else { ok = false; break; }
    }
    if (ok) { if (f._n.startsWith(toks[0])) score += 20; if (f.kind === 'custom' || f.kind === 'ai') score += 5; out.push([score - f.n.length * 0.05, f]); }
  }
  return out.sort((a, b) => b[0] - a[0]).slice(0, 8).map(x => x[1]);
}
/* "200 رز" or "2 بيض" or "150 جم صدر فراخ" */
function parseQuery(q) {
  const m = nd(q).trim().match(/^(\d+(?:\.\d+)?)\s*(جم|جرام|غ|g|gm)?\s+(.+)$/i);
  if (!m) return { text: q, qty: null, grams: false };
  return { text: m[3], qty: parseFloat(m[1]), grams: !!m[2] };
}

}

  const g = v => $(v) ? num($(v).value) : NaN;
  let k = g('fk'), p = g('fp'), c = g('fc'), f = g('ff'), fi = g('fi'); const perS = dlg.per === 's' && !ai; let sg = perS ? g('fg') : NaN;
  if (![p, c, f].every(isFinite)) { msg.textContent = 'اكتب البروتين والكارب والدهون (ممكن صفر).'; msg.className = 'msg err'; return; }
  if (perS && !(sg > 0)) { msg.textContent = 'اكتب وزن الحصة بالجرام.'; msg.className = 'msg err'; return; }
  const est = 4 * p + 4 * c + 9 * f;
  if (!isFinite(k)) k = est;
  if (est > 20 && Math.abs(k - est) / est > 0.25 && !dlg.warned) { dlg.warned = true; msg.textContent = `السعرات (${f0(k)}) بعيدة عن حساب الماكروز (≈ ${f0(est)}). راجع الأرقام، أو اضغط حفظ تاني لو متأكد منها.`; msg.className = 'msg warn'; return; }
  const mul = perS ? 100 / sg : 1; fi = isFinite(fi) ? fi : 0;
  const food = withIdx({ id: 'c' + uid(), n: name, g: 'أكلاتي', al: '', k: k * mul, p: p * mul, c: c * mul, f: f * mul, fi: fi * mul, u: [], kind: ai ? 'ai' : 'custom', src: ai ? 'تقدير Claude (غير معملي)' : (perS ? 'ملصق المنتج (لكل حصة)' : 'إدخال يدوي (لكل 100 جم)'), nt: ai ? (dlg.est.assum || '') : '' });
  if (perS) food.u = [[($('fl') && $('fl').value.trim()) || 'حصة', sg, false]];
  else if (ai) { const s = g('fs'); if (s > 0) food.u = [[dlg.est.servLabel || 'حصة', s, true]]; }
  ['k', 'p', 'c', 'f', 'fi'].forEach(x => food[x] = Math.round(food[x] * 100) / 100);
  S.custom.push(food); touched();
  const itemEl = dlg.itemEl; closeDialog();
  if (itemEl) choose(food, null, itemEl); else { renderAll(); persist(); }
}

/* ---------- export ---------- */
function planRows() {
  const rows = [];
  S.days.forEach(d => d.meals.forEach(m => m.items.forEach(it => {
    const f = foodById(it.fid); if (!f) return; const u = unitOf(f, it); const t = macrosOf(f, it);
    rows.push({ d: d.name, m: m.name, n: f.n, q: it.q, u: u ? u[0] : 'جرام', t, src: f.src });
  })));
  return rows;
}
function msgX(txt, cls) { const el = $('xmsg'); if (el) { el.textContent = txt; el.className = 'msg ' + (cls || ''); } }
function textPlan() {
  const out = []; if (S.plan) out.push(S.plan); if (S.client) out.push('العميل: ' + S.client); if (out.length) out.push('');
  S.days.forEach(d => {
    out.push('■ ' + (d.name || 'يوم')); const dt = dayTotal(d);
    d.meals.forEach(m => {
      if (!m.items.some(i => foodById(i.fid))) return; const mt = mealTotal(m); out.push('— ' + m.name + ` (${f0(mt.k)} سعرة)`);
      m.items.forEach(it => { const f = foodById(it.fid); if (!f) return; const u = unitOf(f, it); const t = macrosOf(f, it); out.push(`  • ${f.n}: ${it.q} ${u ? u[0] : 'جم'} → ${f0(t.k)} سعرة | ب ${f1(t.p)} | ك ${f1(t.c)} | د ${f1(t.f)}`); });
    });
    out.push(`الإجمالي: ${f0(dt.k)} سعرة | بروتين ${f1(dt.p)} جم | كارب ${f1(dt.c)} جم | دهون ${f1(dt.f)} جم`, '');
  });
  return out.join('\n').trim();
}
async function exportText() {
  const txt = textPlan();
  try { await navigator.clipboard.writeText(txt); msgX('تم النسخ.', 'ok'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (x) {} ta.remove(); msgX(ok ? 'تم النسخ.' : 'المتصفح منع النسخ. حدّد النص يدويًا من التنزيل CSV.', ok ? 'ok' : 'err'); }
}
async function exportCsv() {
  const rows = planRows(); if (!rows.length) return msgX('مفيش أكلات تتصدّر لسه.', 'err');
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const head = ['اليوم', 'الوجبة', 'الأكلة', 'الكمية', 'الوحدة', 'الجرامات', 'السعرات', 'البروتين', 'الكارب', 'الدهون', 'الألياف', 'المصدر'];
  const lines = [head.map(q).join(',')].concat(rows.map(r => [r.d, r.m, r.n, r.q, r.u, f1(r.t.g), f0(r.t.k), f1(r.t.p), f1(r.t.c), f1(r.t.f), f1(r.t.fi), r.src].map(q).join(',')));
  const data = '﻿' + lines.join('\r\n');
  try {
    const dl = await (window.claude && window.claude.use ? window.claude.use('downloads') : null);
    if (!dl) return msgX('التنزيل مش متاح في العرض ده. استخدم «نسخ كنص».', 'err');
    await dl.save({ filename: (S.plan || 'diet-plan').replace(/[\\/:*?"<>|]/g, '') + '.csv', data });
    msgX('تم حفظ الملف.', 'ok');
  } catch (e) { msgX(e && e.code === 'declined' ? 'اتلغى التنزيل.' : 'ما قدرتش أحفظ الملف.', e && e.code === 'declined' ? '' : 'err'); }
}

/* ---------- boot ---------- */
renderAll();
window.__t = { FOODS: BASE, search, S: () => S, dayTotal, macrosOf, foodById, norm, parseQuery };
})();
